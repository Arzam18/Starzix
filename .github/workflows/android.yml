name: Build Starzix for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '3rd-party/**'
      - 'makefile'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Do NOT use android-actions/setup-android@v3.
      # That action currently attempts to install the obsolete
      # "tools" SDK package.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              ANDROID_HOME="$ANDROID_SDK_ROOT"
            else
              ANDROID_HOME="/usr/local/lib/android/sdk"
            fi
          fi

          export ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "NDK:"
          echo "$NDK"

          echo "Compiler:"
          "$TOOLCHAIN/aarch64-linux-android24-clang++" --version

      - name: Verify Starzix source
        shell: bash
        run: |
          set -eux

          test -f makefile
          test -d src
          test -f src/main.cpp
          test -f src/nnue.hpp
          test -f src/simd.hpp

          echo "Starzix source detected."

          echo "Build files:"
          ls -la

          echo
          echo "Source files:"
          find src -maxdepth 1 -type f -print | sort

      - name: Verify NNUE network
        shell: bash
        run: |
          set -eux

          if [ ! -f src/net.bin ]; then
            echo "ERROR: src/net.bin was not found."
            echo
            echo "Starzix embeds the NNUE network through incbin.h."
            echo "The network must exist in your fork at:"
            echo
            echo "    src/net.bin"
            echo
            echo "This workflow does not download or replace the network."
            exit 1
          fi

          echo "Found Starzix NNUE network:"
          ls -lh src/net.bin

      - name: Build Starzix ARM64 NEON
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          OUTPUT="$GITHUB_WORKSPACE/Starzix-android-arm64"

          # Starzix's normal makefile uses -march=native.
          # DO NOT use that for Android cross compilation.
          #
          # The GitHub runner is x86-64, while the target is ARM64.
          # Explicitly request ARMv8-A + NEON instead.
          CXXFLAGS="
            -std=c++23
            -O3
            -DNDEBUG
            -flto
            -funroll-loops
            -fconstexpr-steps=100000000
            -march=armv8-a+simd
            -ffunction-sections
            -fdata-sections
            -fno-exceptions
            -Wno-unused-command-line-argument
          "

          LDFLAGS="
            -flto
            -Wl,--gc-sections
            -static-libstdc++
          "

          echo "Compiler:"
          "$CXX" --version

          echo
          echo "Target:"
          "$CXX" -dumpmachine

          echo
          echo "Building Starzix..."

          "$CXX" \
            $CXXFLAGS \
            src/*.cpp \
            -o "$OUTPUT" \
            $LDFLAGS

          chmod +x "$OUTPUT"

          echo
          echo "Build completed:"
          ls -lh "$OUTPUT"

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -eux

          BINARY="Starzix-android-arm64"

          test -f "$BINARY"
          test -x "$BINARY"

          echo "File information:"
          file "$BINARY"

          echo
          echo "ELF information:"
          readelf -h "$BINARY" | grep -E \
            'Class:|Machine:|Type:'

          echo
          echo "Checking for AArch64..."

          file "$BINARY" | grep -q \
            "ELF 64-bit.*ARM aarch64"

      - name: Check dynamic dependencies
        shell: bash
        run: |
          set -eux

          BINARY="Starzix-android-arm64"

          echo "Dynamic section:"
          readelf -d "$BINARY" || true

          echo
          echo "Checking for unwanted shared C++ runtime..."

          if readelf -d "$BINARY" | \
            grep -E 'libc\+\+_shared\.so|libc\+\+\.so'; then

            echo
            echo "ERROR: Binary depends on a shared libc++ library."
            exit 1
          fi

          echo
          echo "No shared libc++ dependency detected."

      - name: Test UCI
        shell: bash
        run: |
          set -eux

          BINARY="./Starzix-android-arm64"

          printf \
            'uci\nisready\nposition startpos\ngo depth 4\nquit\n' \
            | timeout 30 "$BINARY" 2>&1 \
            | tee uci-test.txt

          echo
          echo "Checking UCI response..."

          grep -qi "uciok" uci-test.txt
          grep -qi "readyok" uci-test.txt

          echo
          echo "UCI test passed."

      - name: Prepare single-file artifact
        shell: bash
        run: |
          set -eux

          mkdir -p release

          cp \
            Starzix-android-arm64 \
            release/Starzix-android-arm64

          chmod +x release/Starzix-android-arm64

          echo "Final artifact:"
          ls -lh release/Starzix-android-arm64

      - name: Upload Starzix Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Starzix-android-arm64
          path: release/Starzix-android-arm64
          if-no-files-found: error
