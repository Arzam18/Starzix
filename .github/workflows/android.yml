name: Build Starzix for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '3rd-party/**'
      - 'makefile'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              ANDROID_HOME="$ANDROID_SDK_ROOT"
            else
              ANDROID_HOME="/usr/local/lib/android/sdk"
            fi
          fi

          export ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -eux

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "CXX=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

          "$TOOLCHAIN/aarch64-linux-android24-clang++" --version

      - name: Verify Starzix source
        shell: bash
        run: |
          set -eux

          test -f makefile
          test -d src
          test -f src/main.cpp
          test -f src/nnue.hpp
          test -f src/simd.hpp

          echo "Starzix source detected."

      - name: Verify NNUE network
        shell: bash
        run: |
          set -eux

          if [ ! -f src/net.bin ]; then
            echo "ERROR: src/net.bin was not found."
            echo "The existing Starzix network must remain in your fork."
            exit 1
          fi

          ls -lh src/net.bin

      - name: Build Starzix ARM64 NEON
        shell: bash
        run: |
          set -eux

          OUTPUT="$GITHUB_WORKSPACE/Starzix-android-arm64"

          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          "$CXX" \
            -std=c++23 \
            -O3 \
            -DNDEBUG \
            -flto \
            -funroll-loops \
            -fconstexpr-steps=100000000 \
            -march=armv8-a+simd \
            -ffunction-sections \
            -fdata-sections \
            -Wno-unused-command-line-argument \
            src/*.cpp \
            -o "$OUTPUT" \
            -flto \
            -Wl,--gc-sections \
            -static-libstdc++

          chmod +x "$OUTPUT"

          ls -lh "$OUTPUT"

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -eux

          BINARY="Starzix-android-arm64"

          file "$BINARY"

          file "$BINARY" | grep -q \
            "ELF 64-bit.*ARM aarch64"

          readelf -h "$BINARY" | grep -E \
            'Class:|Machine:'

      - name: Verify libc++ dependency
        shell: bash
        run: |
          set -eux

          BINARY="Starzix-android-arm64"

          readelf -d "$BINARY" || true

          if readelf -d "$BINARY" | \
            grep -E 'libc\+\+_shared\.so|libc\+\+\.so'; then
            echo "ERROR: Shared libc++ dependency detected."
            exit 1
          fi

          echo "No shared libc++ dependency."

      - name: Test UCI
        shell: bash
        run: |
          set -eux

          BINARY="./Starzix-android-arm64"

          printf \
            'uci\nisready\nposition startpos\ngo depth 4\nquit\n' \
            | timeout 30 "$BINARY" 2>&1 \
            | tee uci-test.txt

          grep -qi "uciok" uci-test.txt
          grep -qi "readyok" uci-test.txt

          echo "UCI test passed."

      - name: Prepare single binary
        shell: bash
        run: |
          set -eux

          mkdir -p release

          cp \
            Starzix-android-arm64 \
            release/Starzix-android-arm64

          chmod +x release/Starzix-android-arm64

          ls -lh release/Starzix-android-arm64

      - name: Upload Starzix Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Starzix-android-arm64
          path: release/Starzix-android-arm64
          if-no-files-found: error
