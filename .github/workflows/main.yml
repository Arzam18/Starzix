name: Build Starzix Android Binary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Starzix for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Inject Scalar Simd Fallback for ARM64
        run: |
          # Replace x86-specific Simd.hpp with a portable scalar fallback for ARM64
          cat << 'EOF' > src/Simd.hpp
          // clang-format off
          #pragma once
          #include "utils.hpp"
          #include <algorithm>
          #include <cstdint>

          struct Vec {
              int32_t v[8];
          };

          inline Vec setEpi16(const i16 x) {
              Vec res;
              int16_t* ptr = reinterpret_cast<int16_t*>(res.v);
              for (int i = 0; i < 16; ++i) ptr[i] = x;
              return res;
          }

          inline Vec loadVec(const Vec* vecPtr) {
              return *vecPtr;
          }

          inline Vec clampVec(const Vec vec, const Vec minVec, const Vec maxVec) {
              Vec res;
              const int16_t* pv = reinterpret_cast<const int16_t*>(vec.v);
              const int16_t* pmin = reinterpret_cast<const int16_t*>(minVec.v);
              const int16_t* pmax = reinterpret_cast<const int16_t*>(maxVec.v);
              int16_t* pres = reinterpret_cast<int16_t*>(res.v);
              for (int i = 0; i < 16; ++i) {
                  pres[i] = std::clamp(pv[i], pmin[i], pmax[i]);
              }
              return res;
          }

          inline Vec mulloEpi16(const Vec a, const Vec b) {
              Vec res;
              const int16_t* pa = reinterpret_cast<const int16_t*>(a.v);
              const int16_t* pb = reinterpret_cast<const int16_t*>(b.v);
              int16_t* pres = reinterpret_cast<int16_t*>(res.v);
              for (int i = 0; i < 16; ++i) {
                  pres[i] = static_cast<int16_t>(pa[i] * pb[i]);
              }
              return res;
          }

          inline Vec maddEpi16(const Vec a, const Vec b) {
              Vec res;
              const int16_t* pa = reinterpret_cast<const int16_t*>(a.v);
              const int16_t* pb = reinterpret_cast<const int16_t*>(b.v);
              for (int i = 0; i < 8; ++i) {
                  int32_t prod1 = static_cast<int32_t>(pa[2 * i]) * pb[2 * i];
                  int32_t prod2 = static_cast<int32_t>(pa[2 * i + 1]) * pb[2 * i + 1];
                  res.v[i] = prod1 + prod2;
              }
              return res;
          }

          inline Vec addEpi32(const Vec a, const Vec b) {
              Vec res;
              for (int i = 0; i < 8; ++i) {
                  res.v[i] = a.v[i] + b.v[i];
              }
              return res;
          }

          inline i32 sumVec(const Vec vec) {
              i32 sum = 0;
              for (int i = 0; i < 8; ++i) {
                  sum += vec.v[i];
              }
              return sum;
          }
          EOF

      - name: Build Starzix Executable for Android
        run: |
          # Automatically find 'makefile' case-insensitively
          MAKEFILE_PATH=$(find . -iname "makefile" -maxdepth 3 | head -n 1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: makefile not found!"
            exit 1
          fi
          
          ENGINE_DIR=$(dirname "$MAKEFILE_PATH")
          cd "$ENGINE_DIR"

          # Remove hardcoded -march=native from the makefile to allow cross-compilation
          sed -i 's/-march=native//g' makefile || true
          sed -i 's/-march=native//g' Makefile || true

          # Locate the NDK LLVM toolchain bin directory
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          
          echo "Compiling using: $($CXX --version | head -n 1)"
          
          # Compile using Makefile with cross-compilation flags
          make \
            CXX="$CXX" \
            CXXFLAGS="-std=c++23 -O3 -DNDEBUG -march=armv8-a -funroll-loops -Wall" \
            WARNINGS="" \
            EXE="Starzix_android_arm64"

          # Move binary back to workspace root for artifact uploading
          mv Starzix_android_arm64 ../Starzix_android_arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starzix-android-arm64
          path: Starzix_android_arm64
          retention-days: 14
